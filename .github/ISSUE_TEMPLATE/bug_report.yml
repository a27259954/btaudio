name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BtAudio version
      description: Shown next to the name in the title bar.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: phone
    attributes:
      label: Phone and OS version
      placeholder: iPhone 15 / iOS 18.1
  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter
      description: Device Manager → Bluetooth. Built-in or USB dongle model.
