# Wails project configuration. `info` feeds the generated build assets.
version: '3'

info:
  companyName: "a27259954"
  productName: "BtAudio"
  productIdentifier: "io.github.a27259954.btaudio"
  description: "Use your PC as a Bluetooth speaker for your phone"
  copyright: "(c) 2026 a27259954"
  comments: "BtAudio"
  version: "0.1.0"

# `wails3 dev`
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
