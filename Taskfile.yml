version: '3'

vars:
  APP_NAME: "btaudio"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: windows

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds bin/btaudio.exe
    cmds:
      - task: windows:build

  run:
    summary: Runs the application
    cmds:
      - task: windows:run

  dev:
    summary: Runs the application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs Go tests
    cmds:
      - go test ./internal/...

  check:
    summary: Runs go vet, tests and the i18n check
    cmds:
      - go vet ./...
      - go vet -tags demo .
      - go test ./internal/...
      - npm --prefix frontend run check

  icon:
    summary: Regenerates build/appicon.png and frontend/public/icon.png
    cmds:
      - go run ./tools/genicon
